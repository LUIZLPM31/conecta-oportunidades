# ============================================================
#  Conecta Oportunidades — Configurações da aplicação
# ============================================================

spring.application.name=conecta-oportunidades

# --- Banco de Dados ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/conecta_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Servidor ---
server.port=8080

# --- JWT ---
jwt.secret=${JWT_SECRET:conecta-oportunidades-secret-key-muito-segura-2024}
jwt.expiration=86400000

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Logging ---
logging.level.com.conectaoportunidades=INFO
logging.level.org.springframework.security=WARN
