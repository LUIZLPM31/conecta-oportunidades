# ============================================================
#  Conecta Oportunidades — Configurações da aplicação
# ============================================================

spring.application.name=conecta-oportunidades

# --- Banco de Dados ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Servidor ---
server.port=8080

# --- JWT ---
jwt.secret=${JWT_SECRET:conecta-oportunidades-secret-key-muito-segura-2024}
jwt.expiration=86400000

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Logging ---
logging.level.com.conectaoportunidades=INFO
logging.level.org.springframework.security=WARN
