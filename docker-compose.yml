services:

  # ── Backend 
  backend:
    build: ./backend
    container_name: conecta-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: conecta_db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-cole-aqui-uma-chave-aleatoria-de-256-bits}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://conecta-oportunidades.vercel.app,http://localhost:5173}
    ports:
      - "80:8080"

  # ── Banco de Dados Local
  db:
    image: mysql:8.0
    container_name: conecta-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: conecta_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # ── phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: conecta-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "8081:80"

volumes:
  db_data:
